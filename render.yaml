services:
  - type: web
    name: bingopiramide777
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 -m web.servidor
    envVars:
      - key: BINGO_ADMIN_EMAIL
        value: bingopiramide777@gmail.com
      - key: BINGO_ADMIN_CLAVE
        sync: false
      - key: GMAIL_USER
        value: bingopiramide777@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BINGO_DB
        value: /var/data/bingo777.db
      # Cuenta a la que los jugadores mandan el dinero (Pago Móvil).
      # Si cambian de cuenta, se cambia aquí y Render vuelve a desplegar.
      - key: BINGO_PAGO_BANCO
        value: Banco de Venezuela
      - key: BINGO_PAGO_TELEFONO
        value: "0416-7677264"
      - key: BINGO_PAGO_CEDULA
        value: "12.256.618"
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
