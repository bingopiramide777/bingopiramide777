<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="45%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <linearGradient id="agua2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#aro)"/>
  <circle cx="200" cy="200" r="180" fill="url(#fondo)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#ffd700" stroke-width="2" opacity=".5"/>
  <circle cx="200" cy="200" r="166" fill="none" stroke="#ffe566" stroke-width="1" opacity=".35"/>

  <!-- sol -->
  <circle cx="200" cy="196" r="72" fill="#ffd700" opacity=".28"/>
  <circle cx="200" cy="196" r="44" fill="#ffe566" opacity=".85"/>

  <!-- agua -->
  <path d="M22 232 Q110 218 200 232 T378 232 L378 356 A180 180 0 0 1 22 356 Z" fill="url(#agua2)" opacity=".85"/>

  <!-- tablero -->
  <rect x="22" y="222" width="356" height="9" fill="#0f0f13"/>

  <!-- torres -->
  <g fill="#0f0f13">
    <path d="M138 222 V118 h16 v104 z"/>
    <path d="M246 222 V118 h16 v104 z"/>
  </g>
  <g fill="#1a1a23">
    <rect x="130" y="112" width="32" height="8" rx="3"/>
    <rect x="238" y="112" width="32" height="8" rx="3"/>
  </g>

  <!-- tirantes -->
  <g stroke="#0f0f13" stroke-width="3" fill="none" opacity=".9">
    <path d="M146 130 L40 220"/><path d="M146 130 L110 220"/>
    <path d="M146 130 L200 220"/><path d="M146 130 L290 220"/>
    <path d="M254 130 L110 220"/><path d="M254 130 L200 220"/>
    <path d="M254 130 L290 220"/><path d="M254 130 L360 220"/>
  </g>

  <!-- bola de bingo con el 7 -->
  <g transform="translate(200 300)">
    <circle r="40" fill="#ffffff" opacity=".14"/>
    <circle r="34" fill="url(#aro)"/>
    <circle r="34" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>
    <text x="0" y="13" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="40" font-weight="900" fill="#1a1a23">7</text>
  </g>
  <g transform="translate(118 316)" opacity=".95">
    <circle r="20" fill="#00c853"/>
    <text x="0" y="8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="24" font-weight="900" fill="#0a2a12">7</text>
  </g>
  <g transform="translate(282 316)" opacity=".95">
    <circle r="20" fill="#00c853"/>
    <text x="0" y="8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="24" font-weight="900" fill="#0a2a12">7</text>
  </g>
</svg>
