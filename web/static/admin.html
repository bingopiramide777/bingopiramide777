<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f13">
<title>Administración — Bingo Pirámide 777</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilos.css">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>

<header class="cabecera">
  <a class="marca" href="/">
    <svg class="marca__icono" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 4 43 14v20L24 44 5 34V14z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="6" fill="currentColor"/>
    </svg>
    <span class="marca__texto">Bingo<b>Pirámide</b><em>777</em></span>
  </a>
  <nav class="nav" id="nav-admin">
    <button data-ventana="resumen">Resumen</button>
    <button data-ventana="glenis">Glenis IA</button>
    <button data-ventana="depositos">Depósitos</button>
    <button data-ventana="retiros">Retiros</button>
    <button data-ventana="jugadores">Jugadores</button>
    <button data-ventana="partidas">Partidas</button>
    <button data-ventana="salas">Salas</button>
    <button data-ventana="ganancias">Ganancias</button>
    <button data-ventana="movimientos">Movimientos</button>
  </nav>
  <div class="sesion" id="sesion"></div>
</header>

<main>
  <section class="panel">
    <h2>Panel de administración</h2>
    <p class="entrada">Aquí ves el dinero, los jugadores, las partidas y los retiros pendientes.
       Abre cada ventana cuando la necesites: cada una carga solo lo suyo.</p>
    <div class="lanzadera" id="lanzadera"></div>
  </section>

  <div id="ventanas"></div>
</main>

<footer class="pie">
  <p><strong>Bingo Pirámide 777</strong> — administración.</p>
</footer>

<div class="dialogo" id="dialogo" hidden>
  <div class="dialogo__caja" role="dialog" aria-modal="true">
    <button class="dialogo__cerrar" id="dialogo-cerrar" aria-label="Cerrar">×</button>
    <div id="dialogo-contenido"></div>
  </div>
</div>

<div class="brindis" id="brindis" hidden></div>

<script src="/admin.js"></script>
</body>
</html>
